<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10091e">
<title>DeltaX Studio</title>
<style>
:root{color-scheme:dark;--bg:#10091e;--panel:#1b1430;--line:#49336d;--purple:#853fe8;--text:#f7f2ff;--muted:#bba8d5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
header{padding:calc(18px + env(safe-area-inset-top)) 17px 18px;background:#1b1030;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#bd8aff,#702ce0);font-size:24px;font-weight:900}
h1{font-size:21px;margin:0;color:#d1aaff}
header p{color:var(--muted);margin:5px 0 0;font-size:12px}
main{padding:15px;max-width:850px;margin:auto;padding-bottom:45px}
.intro{padding:12px 2px 18px}
.intro h2{font-size:27px;margin:0 0 8px}
.intro p{color:var(--muted);line-height:1.5;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:15px;min-width:0}
h3{margin:0 0 14px;font-size:17px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
input[type=text],textarea{width:100%;background:#0d0918;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:12px;font:14px inherit;outline:none}
input[type=text]{font-size:14px}
textarea{display:block;min-height:300px;resize:vertical;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2}
input:focus,textarea:focus{border-color:#bd8aff}
button,.upload{display:inline-block;background:var(--purple);color:white;border:0;border-radius:9px;padding:11px 13px;margin:5px 3px 3px 0;font-size:13px;font-weight:700;cursor:pointer}
button.secondary,.upload.secondary{background:#302044;border:1px solid #63418b}
button.danger{background:#512035;border:1px solid #853c60}
button:active{opacity:.8}
.actions{display:flex;flex-wrap:wrap;gap:5px}
.actions button{flex:1}
.note{font-size:12px;line-height:1.6;color:var(--muted)}
#status{font-size:12px;color:#b9f5d7;overflow-wrap:anywhere}
#saved{overflow-wrap:anywhere}
.saved-row{padding:12px 0;border-bottom:1px solid var(--line)}
.saved-row:last-child{border-bottom:0}
.saved-title{font-weight:700;overflow-wrap:anywhere}
.saved-actions{margin-top:5px}
#console{background:#0b0813;border:1px solid var(--line);padding:12px;border-radius:9px;min-height:65px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace}
footer{text-align:center;color:#75658b;font-size:11px;padding:8px 15px 24px}
@media(min-width:600px){main{padding-top:25px}.intro h2{font-size:32px}textarea{min-height:390px}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">Δ</div>
    <div>
      <h1>DeltaX Studio</h1>
      <p>Mobile Lua Script Workspace</p>
    </div>
  </div>
</header>
<main>
  <section class="intro">
    <h2>Your scripts. Your workspace.</h2>
    <p>Write, save, import, and export Lua script drafts right from your phone.</p>
  </section>
  <section class="card">
    <h3>Script Editor</h3>
    <label for="name">Script name</label>
    <input id="name" type="text" value="MyScript.lua" maxlength="100">
<label for="code">Lua source code</label>
<textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off">-- Welcome to DeltaX Studio

– Write your Lua code here.

print(“Hello, world!”)

<div class="actions">
  <button id="saveBtn">Save Script</button>
  <button id="newBtn" class="secondary">New Script</button>
  <button id="exportBtn" class="secondary">Export .lua</button>
</div>
<div class="actions">
  <button id="importBtn" class="secondary">Import Script</button>
  <button id="checkBtn" class="secondary">Check Draft</button>
  <button id="clearBtn" class="danger">Clear Editor</button>
</div>
<input id="file" type="file" accept=".lua,.luau,.txt,text/plain" hidden>
<p id="status">Ready. Your scripts are stored in this browser.</p>
<p class="note">This is a Lua text editor and organizer. It does not inject scripts into Roblox or execute code inside the Roblox app.</p>
  </section>
  <section class="card">
    <h3>My Saved Scripts</h3>
    <div id="saved"></div>
  </section>
  <section class="card">
    <h3>Script Checker Console</h3>
    <div class="actions">
      <button id="clearConsoleBtn" class="secondary">Clear Console</button>
    </div>
    <pre id="console">[INFO] DeltaX Studio ready.
[INFO] Local editing enabled.</pre>
  </section>
  <section class="card">
    <h3>Backup</h3>
    <p class="note">Export your saved scripts as a backup file. Saved scripts stay in this browser, so clearing browser data may erase them.</p>
    <div class="actions">
      <button id="backupBtn">Export All Scripts</button>
      <button id="deleteAllBtn" class="danger">Delete All Scripts</button>
    </div>
  </section>
</main>
<footer>DeltaX Studio · Mobile-friendly · No key system</footer>
<script>
'use strict';
const $ = id => document.getElementById(id);
const STORAGE_KEY = 'deltax_studio_scripts_v1';
const DRAFT_KEY = 'deltax_studio_draft_v1';
let scripts = [];
let currentId = null;
try {
  const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  scripts = Array.isArray(stored) ? stored : [];
} catch (error) {
  scripts = [];
}
function setStatus(message) {
  $('status').textContent = message;
}
function log(message) {
  const output = $('console');
  output.textContent += '\n' + message;
  output.scrollTop = output.scrollHeight;
}
function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(scripts));
    renderSaved();
  } catch (error) {
    setStatus('Could not save. Your browser storage may be full.');
  }
}
function saveDraft() {
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      name: $('name').value,
      code: $('code').value,
      id: currentId
    }));
  } catch (error) {
    // Editing can continue if local storage is unavailable.
  }
}
function saveScript() {
  let name = $('name').value.trim() || 'MyScript.lua';
  if (!/\.lua(u)?$/i.test(name)) name += '.lua';
  const code = $('code').value;
  let existing = scripts.find(item => item.id === currentId);
  if (existing) {
    existing.name = name;
    existing.code = code;
    existing.updated = Date.now();
  } else {
    const item = {
      id: Date.now().toString() + Math.random().toString(16).slice(2),
      name: name,
      code: code,
      updated: Date.now()
    };
    scripts.unshift(item);
    currentId = item.id;
  }
  persist();
  saveDraft();
  setStatus('Saved ' + name);
  log('[SAVED] ' + name);
}
function newScript() {
  currentId = null;
  $('name').value = 'MyScript.lua';
  $('code').value = '-- New Lua script\n\n';
  saveDraft();
  setStatus('New draft created.');
  window.scrollTo({top: 0, behavior: 'smooth'});
  $('code').focus();
}
function safeFilename(name) {
  return name.replace(/[^\w.-]+/g, '_');
}
function downloadFile(filename, content, type) {
  const blob = new Blob([content], {type: type || 'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = safeFilename(filename);
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function exportScript() {
  let name = $('name').value.trim() || 'MyScript.lua';
  if (!/\.lua(u)?$/i.test(name)) name += '.lua';
  downloadFile(name, $('code').value);
  setStatus('Exported ' + name);
  log('[EXPORT] ' + name);
}
function importScript(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    currentId = null;
    $('name').value = file.name;
    $('code').value = String(reader.result || '');
    saveDraft();
    setStatus('Imported ' + file.name);
    log('[IMPORT] ' + file.name);
  };
  reader.onerror = () => setStatus('Could not read that file.');
  reader.readAsText(file);
  event.target.value = '';
}
function openScript(id) {
  const item = scripts.find(script => script.id === id);
  if (!item) return;
  currentId = item.id;
  $('name').value = item.name;
  $('code').value = item.code;
  saveDraft();
  setStatus('Opened ' + item.name);
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function deleteScript(id) {
  const item = scripts.find(script => script.id === id);
  if (!item || !confirm('Delete ' + item.name + '?')) return;
  scripts = scripts.filter(script => script.id !== id);
  if (currentId === id) currentId = null;
  persist();
  setStatus('Script deleted.');
  log('[DELETE] ' + item.name);
}
function renderSaved() {
  const container = $('saved');
  container.replaceChildren();
  if (!scripts.length) {
    const empty = document.createElement('p');
    empty.className = 'note';
    empty.textContent = 'No saved scripts yet. Save a draft to see it here.';
    container.appendChild(empty);
    return;
  }
  scripts.forEach(item => {
    const row = document.createElement('div');
    row.className = 'saved-row';
    const title = document.createElement('div');
    title.className = 'saved-title';
    title.textContent = item.name;
    const info = document.createElement('p');
    info.className = 'note';
    info.textContent = String(item.code.length) + ' characters';
    const actions = document.createElement('div');
    actions.className = 'saved-actions';
    const open = document.createElement('button');
    open.textContent = 'Open';
    open.onclick = () => openScript(item.id);
    const exportButton = document.createElement('button');
    exportButton.className = 'secondary';
    exportButton.textContent = 'Export';
    exportButton.onclick = () => {
      let filename = item.name;
      if (!/\.lua(u)?$/i.test(filename)) filename += '.lua';
      downloadFile(filename, item.code);
    };
    const remove = document.createElement('button');
    remove.className = 'danger';
    remove.textContent = 'Delete';
    remove.onclick = () => deleteScript(item.id);
    actions.append(open, exportButton, remove);
    row.append(title, info, actions);
    container.appendChild(row);
  });
}
function checkDraft() {
  const code = $('code').value;
  const issues = [];
  if (!code.trim()) issues.push('The draft is empty.');
  const pairs = [['(', ')'], ['{', '}'], ['[', ']']];
  pairs.forEach(pair => {
    const openCount = code.split(pair[0]).length - 1;
    const closeCount = code.split(pair[1]).length - 1;
    if (openCount !== closeCount) {
      issues.push('Check matching ' + pair[0] + ' and ' + pair[1] + ' characters.');
    }
  });
  if (!issues.length) {
    issues.push('Basic text checks passed.');
  }
  issues.push('This is not a full Lua compiler. No code was executed.');
  log('[CHECK]\n- ' + issues.join('\n- '));
  setStatus('Draft check finished. See the console.');
}
function exportAll() {
  downloadFile(
    'deltax-scripts-backup.json',
    JSON.stringify(scripts, null, 2),
    'application/json'
  );
  log('[BACKUP] Exported saved scripts.');
}
function deleteAll() {
  if (!confirm('Delete every saved script? This cannot be undone.')) return;
  scripts = [];
  currentId = null;
  persist();
  setStatus('All saved scripts deleted.');
  log('[DELETE] All saved scripts removed.');
}
$('saveBtn').addEventListener('click', saveScript);
$('newBtn').addEventListener('click', newScript);
$('exportBtn').addEventListener('click', exportScript);
$('importBtn').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', importScript);
$('checkBtn').addEventListener('click', checkDraft);
$('clearBtn').addEventListener('click', () => {
  if (confirm('Clear the editor text?')) {
    $('code').value = '';
    saveDraft();
    setStatus('Editor cleared.');
  }
});
$('clearConsoleBtn').addEventListener('click', () => {
  $('console').textContent = '[INFO] Console cleared.';
});
$('backupBtn').addEventListener('click', exportAll);
$('deleteAllBtn').addEventListener('click', deleteAll);
$('code').addEventListener('input', saveDraft);
$('name').addEventListener('input', saveDraft);
try {
  const draft = JSON.parse(localStorage.getItem(DRAFT) || 'null');
  if (draft) {
    if (typeof draft.name === 'string') $('name').value = draft.name;
    if (typeof draft.code === 'string') $('code').value = draft.code;
    if (draft.id) currentId = draft.id;
  }
} catch (error) {
  // Start with the default draft if saved draft data is invalid.
}
renderSaved();
</script>
</body>
</html>
